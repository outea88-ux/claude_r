<!-- Seluruh gaya dan skrip berada di dalam berkas ini / folder aset lokal.

<body>

<!-- Pesan bila perangkat dipegang tegak pada layar kecil -->
<div id="putar-hp">
  <div class="isi">
    <svg viewBox="0 0 24 24" fill="none" stroke="#f0c14b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="7" width="18" height="10" rx="2"/>
      <path d="M12 3v2M12 19v2"/>
      <path d="M7.5 10.5 5 13l2.5 2.5"/>
    </svg>
    <h2>Putar perangkatmu</h2>
    <p>Media ini dirancang dengan tampilan lebar 16:9. Putar ponsel ke posisi mendatar agar semua bagian terlihat jelas.</p>
  </div>
</div>

<!-- Panggung berukuran tetap 1280x720, diskalakan agar pas di layar apa pun -->
<div id="panggung-wrap">
  <div id="panggung">
    <header id="bilah-atas" class="bilah-atas"></header>
    <div id="isi-panggung" class="isi-penuh kolom"></div>
  </div>
</div>

<noscript>
  <div style="padding:32px;font-family:system-ui,sans-serif;color:#fff;text-align:center">
    <h2>JavaScript perlu diaktifkan</h2>
    <p>Media pembelajaran ini berjalan sepenuhnya di dalam peramban dan membutuhkan JavaScript.</p>
  </div>
</noscript>
