<style>
/* ===== styles/tokens.css ===== */
/* ============================================================
   Rumah Permainan Nusantara — Design Tokens
   Palet terinspirasi warna alam & kain Nusantara.
   Semua warna diuji kontras minimal 4.5:1 untuk teks.
   Tidak ada aset eksternal. Tidak ada @import.
   ============================================================ */
:root {
  /* --- Warna dasar --- */
  --c-ink:        #16233a;   /* teks utama   — kontras 14.2:1 di atas kertas */
  --c-ink-soft:   #4a5a75;   /* teks sekunder — kontras 6.4:1 */
  --c-ink-faint:  #6d7c95;   /* label kecil   — kontras 4.6:1 */

  --c-paper:      #fbf7f0;   /* latar halaman (kertas hangat) */
  --c-surface:    #ffffff;   /* kartu */
  --c-surface-2:  #f2ece1;   /* kartu tenggelam */
  --c-line:       #ded4c4;   /* garis pembatas */
  --c-line-soft:  #ebe3d6;

  /* --- Warna aksen (identitas "Biru Putih") --- */
  --c-blue:       #14509b;   /* primer      — 7.3:1 di atas putih */
  --c-blue-deep:  #0b356b;   /* header gelap — 11.1:1 */
  --c-blue-soft:  #e6eff9;
  --c-blue-line:  #b9d1ec;

  --c-red:        #b3261e;   /* bahaya / energi — 6.4:1 */
  --c-red-soft:   #fce9e7;
  --c-red-line:   #f2c0bb;

  --c-amber:      #a86a08;   /* sorot / kunyit — 4.8:1 */
  --c-amber-soft: #fdf1dc;
  --c-amber-line: #eccf9a;

  --c-green:      #1c6b45;   /* benar / berhasil — 6.1:1 */
  --c-green-soft: #e4f2ea;
  --c-green-line: #a9d3bd;

  --c-plum:       #6b3f96;   /* variabel kedua — 6.9:1 */
  --c-plum-soft:  #f0e9f8;
  --c-plum-line:  #d3bfe8;

  --c-wood:       #8a5a2b;   /* bambu / kayu */
  --c-wood-soft:  #f4e7d6;

  /* --- Panggung 16:9 --- */
  --stage-w: 1280px;
  --stage-h: 720px;

  /* --- Jarak --- */
  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;
  --sp-5: 20px; --sp-6: 24px; --sp-8: 32px; --sp-10: 40px;

  /* --- Sudut --- */
  --r-sm: 8px; --r-md: 12px; --r-lg: 18px; --r-xl: 26px; --r-pill: 999px;

  /* --- Bayangan (halus, tidak menutupi informasi) --- */
  --sh-1: 0 1px 2px rgba(22,35,58,.07), 0 1px 1px rgba(22,35,58,.04);
  --sh-2: 0 4px 10px rgba(22,35,58,.08), 0 1px 3px rgba(22,35,58,.05);
  --sh-3: 0 12px 28px rgba(22,35,58,.12), 0 3px 8px rgba(22,35,58,.06);

  /* --- Huruf: tumpukan sistem, tanpa unduhan eksternal --- */
  --f-body: ui-rounded, "Segoe UI Variable Display", "Segoe UI", system-ui,
            -apple-system, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  --f-num:  ui-monospace, "SFMono-Regular", "Consolas", "Roboto Mono", monospace;

  /* --- Ukuran sentuh minimum sesuai panduan (44x44 px) --- */
  --touch: 44px;
}

</style>
<style>
/* ===== styles/base.css ===== */
/* ============================================================
   Dasar + Panggung 16:9
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0; height: 100%;
  background: #101a2b;          /* bingkai gelap di luar panggung */
  font-family: var(--f-body);
  color: var(--c-ink);
  -webkit-text-size-adjust: 100%;
  overflow: hidden;
}

button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }

/* --- Pembungkus panggung: selalu menjaga rasio 16:9 --- */
#panggung-wrap {
  position: fixed; inset: 0;
  overflow: hidden;
  background:
    radial-gradient(120% 100% at 50% 0%, #1b2a45 0%, #101a2b 60%, #0a121f 100%);
}

/* Panggung berukuran tetap 1280x720 lalu diperkecil agar muat.
   Elemen yang diskalakan tetap menempati kotak tata letak aslinya,
   jadi pemusatan tidak boleh mengandalkan grid — kalau tidak,
   pada layar yang lebih kecil dari 1280x720 panggung akan meleset
   keluar layar. Karena itu dipakai penempatan mutlak + translate. */
#panggung {
  position: absolute;
  left: 50%;
  top: 50%;
  width: var(--stage-w);
  height: var(--stage-h);
  transform: translate(-50%, -50%) scale(1);
  transform-origin: center center;
  background: var(--c-paper);
  overflow: hidden;
  box-shadow: 0 24px 70px rgba(0,0,0,.55);
  border-radius: 4px;
  display: flex;
  flex-direction: column;
}

/* Saat layar sangat sempit & tegak, sarankan memutar perangkat */
#putar-hp {
  position: fixed; inset: 0; z-index: 90;
  display: none;
  place-items: center;
  background: #101a2b;
  color: #fff;
  text-align: center;
  padding: var(--sp-8);
}
#putar-hp .isi { max-width: 300px; }
#putar-hp svg { width: 72px; height: 72px; margin-bottom: var(--sp-4); }
#putar-hp h2 { font-size: 20px; margin: 0 0 var(--sp-2); }
#putar-hp p  { font-size: 14px; line-height: 1.6; color: #b9c6dc; margin: 0; }
body.perlu-putar #putar-hp { display: grid; }

/* --- Tipografi panggung --- */
h1, h2, h3, h4 { margin: 0; line-height: 1.25; font-weight: 700; letter-spacing: -.01em; }
p { margin: 0; line-height: 1.6; }

.judul-xl { font-size: 40px; font-weight: 800; }
.judul-l  { font-size: 27px; font-weight: 800; }
.judul-m  { font-size: 20px; }
.judul-s  { font-size: 16px; }
.teks     { font-size: 15px; }
.teks-s   { font-size: 13.5px; }
.teks-xs  { font-size: 12px; }
.lembut   { color: var(--c-ink-soft); }
.samar    { color: var(--c-ink-faint); }
.angka    { font-family: var(--f-num); font-variant-numeric: tabular-nums; }

/* --- Utilitas tata letak minimal --- */
.baris  { display: flex; align-items: center; }
.kolom  { display: flex; flex-direction: column; }
.antara { justify-content: space-between; }
.tengah { justify-content: center; }
.isi-penuh { flex: 1 1 auto; min-height: 0; min-width: 0; }
.g1 { gap: 4px; } .g2 { gap: 8px; } .g3 { gap: 12px; }
.g4 { gap: 16px; } .g5 { gap: 20px; } .g6 { gap: 24px; }
.bungkus { flex-wrap: wrap; }

/* --- Aksesibilitas --- */
:focus-visible {
  outline: 3px solid var(--c-amber);
  outline-offset: 2px;
  border-radius: 6px;
}
.hanya-pembaca-layar {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* Hormati preferensi pengguna yang sensitif terhadap gerak */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
  }
}

</style>
<style>
/* ===== styles/components.css ===== */
/* ============================================================
   Komponen antarmuka
   ============================================================ */

/* ---------- Bilah atas ---------- */
.bilah-atas {
  flex: none;
  height: 58px;
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--sp-4);
  padding: 0 var(--sp-5);
  background: var(--c-blue-deep);
  color: #fff;
  box-shadow: var(--sh-2);
  z-index: 20;
}
.bilah-atas .merek { display: flex; align-items: center; gap: 10px; min-width: 0; }
.bilah-atas .lambang {
  width: 34px; height: 34px; flex: none;
  border-radius: 10px;
  background: linear-gradient(140deg, #f0c14b, #d98324);
  display: grid; place-items: center;
  color: #4a2d05; font-weight: 800; font-size: 15px;
}
.bilah-atas .nama { font-size: 15px; font-weight: 700; white-space: nowrap; }
.bilah-atas .sub  { font-size: 11.5px; color: #a8c2e4; white-space: nowrap; }

/* ---------- Indikator progres langkah ---------- */
.progres { display: flex; align-items: center; gap: 6px; }
.progres .titik {
  width: 9px; height: 9px; border-radius: 50%;
  background: rgba(255,255,255,.28);
  transition: background .2s, transform .2s;
}
.progres .titik.aktif   { background: #f0c14b; transform: scale(1.35); }
.progres .titik.selesai { background: #6fd39b; }
.progres .label { font-size: 11.5px; color: #a8c2e4; margin-left: 4px; white-space: nowrap; }

/* ---------- Tombol ---------- */
.tbl {
  min-height: var(--touch);
  min-width: var(--touch);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 18px;
  border: 1.5px solid transparent;
  border-radius: var(--r-pill);
  font-size: 14px; font-weight: 700;
  background: var(--c-surface-2); color: var(--c-ink);
  transition: transform .12s ease, box-shadow .18s ease, background .18s ease;
  -webkit-tap-highlight-color: transparent;
}
.tbl:hover  { box-shadow: var(--sh-2); }
.tbl:active { transform: translateY(1px) scale(.985); }
.tbl svg { width: 17px; height: 17px; flex: none; }

.tbl-utama   { background: var(--c-blue);  color: #fff; box-shadow: var(--sh-2); }
.tbl-utama:hover { background: #16599f; box-shadow: var(--sh-3); }
.tbl-garis   { background: var(--c-surface); border-color: var(--c-line); }
.tbl-garis:hover { border-color: var(--c-blue-line); background: var(--c-blue-soft); }
.tbl-sunyi   { background: transparent; color: var(--c-ink-soft); }
.tbl-sunyi:hover { background: var(--c-surface-2); color: var(--c-ink); }
.tbl-bahaya  { background: var(--c-red-soft); color: var(--c-red); border-color: var(--c-red-line); }
.tbl-kecil   { padding: 7px 13px; font-size: 13px; min-height: 36px; }
.tbl-bulat   { width: var(--touch); height: var(--touch); padding: 0; border-radius: 50%; }
.tbl[disabled] { opacity: .42; pointer-events: none; }

/* Tombol pada bilah atas */
.bilah-atas .tbl {
  background: rgba(255,255,255,.12); color: #fff; border-color: rgba(255,255,255,.22);
}
.bilah-atas .tbl:hover { background: rgba(255,255,255,.22); }

/* ---------- Kartu ---------- */
.kartu {
  background: var(--c-surface);
  border: 1px solid var(--c-line-soft);
  border-radius: var(--r-lg);
  box-shadow: var(--sh-1);
}
.kartu-pad { padding: var(--sp-5); }
.kartu-tenggelam { background: var(--c-surface-2); border-color: var(--c-line); box-shadow: none; }

/* ---------- Lencana ---------- */
.lencana {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 11px; border-radius: var(--r-pill);
  font-size: 11.5px; font-weight: 700; letter-spacing: .01em;
  background: var(--c-blue-soft); color: var(--c-blue); border: 1px solid var(--c-blue-line);
  white-space: nowrap;
}
.lencana-kuning { background: var(--c-amber-soft); color: var(--c-amber); border-color: var(--c-amber-line); }
.lencana-hijau  { background: var(--c-green-soft); color: var(--c-green); border-color: var(--c-green-line); }
.lencana-ungu   { background: var(--c-plum-soft);  color: var(--c-plum);  border-color: var(--c-plum-line); }
.lencana-merah  { background: var(--c-red-soft);   color: var(--c-red);   border-color: var(--c-red-line); }

/* ---------- Halaman / tampilan ---------- */
.layar { display: none; flex: 1 1 auto; min-height: 0; }
.layar.tampil { display: flex; flex-direction: column; }

.isi-layar {
  flex: 1 1 auto; min-height: 0;
  padding: var(--sp-6) var(--sp-8);
  overflow-y: auto;
  overscroll-behavior: contain;
}
.isi-layar::-webkit-scrollbar { width: 10px; }
.isi-layar::-webkit-scrollbar-track { background: transparent; }
.isi-layar::-webkit-scrollbar-thumb { background: var(--c-line); border-radius: 5px; border: 3px solid var(--c-paper); }

/* ---------- Bilah navigasi bawah ---------- */
.bilah-bawah {
  flex: none;
  height: 62px;
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--sp-4);
  padding: 0 var(--sp-8);
  background: var(--c-surface);
  border-top: 1px solid var(--c-line);
  z-index: 10;
}

/* ---------- Penggeser (slider) ---------- */
.penggeser { display: flex; flex-direction: column; gap: 6px; }
.penggeser .kepala { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.penggeser .nama { font-size: 13px; font-weight: 700; color: var(--c-ink); }
.penggeser .nilai {
  font-family: var(--f-num); font-size: 13px; font-weight: 700;
  color: var(--c-blue); background: var(--c-blue-soft);
  padding: 2px 9px; border-radius: var(--r-pill); white-space: nowrap;
}
.penggeser .skala { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--c-ink-faint); }

input[type=range] {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 30px;            /* area sentuh nyaman */
  background: transparent; margin: 0; cursor: pointer;
}
input[type=range]::-webkit-slider-runnable-track {
  height: 8px; border-radius: 4px;
  background: var(--c-surface-2); border: 1px solid var(--c-line);
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 24px; height: 24px; margin-top: -9px;
  border-radius: 50%; background: var(--c-blue);
  border: 3px solid #fff; box-shadow: var(--sh-2);
}
input[type=range]::-moz-range-track {
  height: 8px; border-radius: 4px;
  background: var(--c-surface-2); border: 1px solid var(--c-line);
}
input[type=range]::-moz-range-thumb {
  width: 24px; height: 24px; border-radius: 50%;
  background: var(--c-blue); border: 3px solid #fff; box-shadow: var(--sh-2);
}

/* ---------- Pilihan berbentuk kartu (preset) ---------- */
.pilihan-grid { display: grid; gap: 8px; }
.pilihan {
  min-height: var(--touch);
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 9px 6px;
  border: 2px solid var(--c-line);
  border-radius: var(--r-md);
  background: var(--c-surface);
  text-align: center;
  transition: border-color .15s, background .15s, transform .12s;
}
.pilihan:hover { border-color: var(--c-blue-line); background: var(--c-blue-soft); }
.pilihan:active { transform: translateY(1px); }
.pilihan .ikon { font-size: 20px; line-height: 1; }
.pilihan .tajuk { font-size: 12.5px; font-weight: 700; }
.pilihan .ket { font-size: 10.5px; color: var(--c-ink-faint); line-height: 1.3; }
.pilihan[aria-pressed="true"] {
  border-color: var(--c-blue); background: var(--c-blue-soft);
  box-shadow: inset 0 0 0 1px var(--c-blue);
}
.pilihan[aria-pressed="true"] .tajuk { color: var(--c-blue); }

/* ---------- Panel ukur (HUD) ---------- */
.ukur-grid { display: grid; gap: 8px; }
.ukur {
  background: var(--c-surface);
  border: 1px solid var(--c-line-soft);
  border-left: 4px solid var(--c-blue);
  border-radius: var(--r-md);
  padding: 8px 11px;
}
.ukur .nama { font-size: 10.5px; font-weight: 800; letter-spacing: .04em;
              text-transform: uppercase; color: var(--c-ink-faint); }
.ukur .nilai { font-family: var(--f-num); font-size: 20px; font-weight: 700; line-height: 1.15; }
.ukur .satuan { font-size: 11px; color: var(--c-ink-faint); font-weight: 600; }
.ukur .bar { height: 5px; border-radius: 3px; background: var(--c-surface-2); overflow: hidden; margin-top: 5px; }
.ukur .bar > i { display: block; height: 100%; width: 0%; border-radius: 3px; background: var(--c-blue); transition: width .12s linear; }
.ukur-kuning { border-left-color: var(--c-amber); }
.ukur-kuning .bar > i { background: var(--c-amber); }
.ukur-hijau  { border-left-color: var(--c-green); }
.ukur-hijau .bar > i { background: var(--c-green); }
.ukur-ungu   { border-left-color: var(--c-plum); }
.ukur-ungu .bar > i { background: var(--c-plum); }
.ukur-merah  { border-left-color: var(--c-red); }
.ukur-merah .bar > i { background: var(--c-red); }

/* ---------- Kanvas simulasi ---------- */
.panggung-sim {
  position: relative;
  border-radius: var(--r-lg);
  overflow: hidden;
  background: var(--c-surface);
  border: 1px solid var(--c-line);
  box-shadow: var(--sh-1);
}
.panggung-sim canvas { display: block; width: 100%; height: 100%; touch-action: none; }

/* ---------- Kotak catatan / sains ---------- */
.catatan {
  border-radius: var(--r-md);
  padding: 11px 13px;
  font-size: 13px; line-height: 1.55;
  border: 1px solid var(--c-blue-line);
  background: var(--c-blue-soft);
  color: var(--c-ink);
}
.catatan .tajuk { font-weight: 800; font-size: 12.5px; display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
.catatan-kuning { background: var(--c-amber-soft); border-color: var(--c-amber-line); }
.catatan-hijau  { background: var(--c-green-soft); border-color: var(--c-green-line); }
.catatan-merah  { background: var(--c-red-soft);   border-color: var(--c-red-line); }
.catatan-ungu   { background: var(--c-plum-soft);  border-color: var(--c-plum-line); }

/* ---------- Kuis ---------- */
.kuis-soal { font-size: 16px; font-weight: 700; line-height: 1.5; }
.kuis-opsi { display: grid; gap: 9px; }
.opsi {
  min-height: var(--touch);
  display: flex; align-items: center; gap: 11px;
  width: 100%; padding: 11px 15px;
  border: 2px solid var(--c-line);
  border-radius: var(--r-md);
  background: var(--c-surface);
  text-align: left; font-size: 14.5px; font-weight: 600; line-height: 1.4;
  transition: border-color .15s, background .15s;
}
.opsi:hover:not([disabled]) { border-color: var(--c-blue); background: var(--c-blue-soft); }
.opsi .huruf {
  flex: none; width: 27px; height: 27px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--c-surface-2); color: var(--c-ink-soft);
  font-size: 13px; font-weight: 800;
}
.opsi.benar { border-color: var(--c-green); background: var(--c-green-soft); }
.opsi.benar .huruf { background: var(--c-green); color: #fff; }
.opsi.salah { border-color: var(--c-red); background: var(--c-red-soft); }
.opsi.salah .huruf { background: var(--c-red); color: #fff; }
.opsi[disabled] { cursor: default; }

/* ---------- Langkah panduan ---------- */
.langkah { display: flex; gap: 13px; align-items: flex-start; }
.langkah .nomor {
  flex: none; width: 30px; height: 30px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--c-blue); color: #fff; font-weight: 800; font-size: 14px;
}

/* ---------- Kartu modul di menu ---------- */
.kartu-modul {
  display: flex; flex-direction: column; gap: 9px;
  padding: var(--sp-4);
  border: 1px solid var(--c-line);
  border-radius: var(--r-lg);
  background: var(--c-surface);
  box-shadow: var(--sh-1);
  text-align: left;
  transition: transform .15s ease, box-shadow .2s ease, border-color .2s ease;
}
.kartu-modul:hover { transform: translateY(-3px); box-shadow: var(--sh-3); border-color: var(--c-blue-line); }
.kartu-modul .gambar {
  height: 96px; border-radius: var(--r-md);
  display: grid; place-items: center; font-size: 44px;
  background: var(--c-surface-2);
}
.kartu-modul .tajuk { font-size: 15.5px; font-weight: 800; }
.kartu-modul .ket { font-size: 12.5px; color: var(--c-ink-soft); line-height: 1.45; }
.kartu-modul .kaki { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: auto; }

/* ---------- Animasi ringan ---------- */
@keyframes munculHalus { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: none; } }
.muncul { animation: munculHalus .32s cubic-bezier(.22,.9,.3,1) both; }
@keyframes denyut { 0%,100% { transform: scale(1); } 50% { transform: scale(1.07); } }
.denyut { animation: denyut 1.6s ease-in-out infinite; }

</style>
</head>
<body>

<!-- Pesan bila perangkat dipegang tegak pada layar kecil -->

<script>
/* ===== scripts/core/bus.js ===== */
/* ============================================================
   bus.js — penyampai pesan sederhana antar bagian aplikasi
   ============================================================ */
(function (RPN) {
  'use strict';
  var peta = {};
  RPN.bus = {
    dengar: function (nama, fn) {
      (peta[nama] = peta[nama] || []).push(fn);
      return function () { RPN.bus.lepas(nama, fn); };
    },
    lepas: function (nama, fn) {
      var a = peta[nama]; if (!a) return;
      var i = a.indexOf(fn); if (i > -1) a.splice(i, 1);
    },
    pancar: function (nama, data) {
      var a = peta[nama]; if (!a) return;
      for (var i = 0; i < a.length; i++) {
        try { a[i](data); } catch (e) { /* satu pendengar gagal tidak menghentikan sisanya */ }
      }
    }
  };
})(window.RPN = window.RPN || {});

</script>
<script>
/* ===== scripts/core/stage.js ===== */
/* ============================================================
   stage.js — menjaga rasio 16:9 di semua perangkat
   Panggung berukuran tetap 1280x720 lalu diskalakan agar pas
   di layar apa pun (laptop, tablet, ponsel) tanpa distorsi.
   ============================================================ */
(function (RPN) {
  'use strict';

  var LEBAR = 1280, TINGGI = 720;
  var el, wrap, siapPutar = false;

  function pasang() {
    el   = document.getElementById('panggung');
    wrap = document.getElementById('panggung-wrap');
    if (!el) return;
    skala();
    window.addEventListener('resize', skala, { passive: true });
    window.addEventListener('orientationchange', function () { setTimeout(skala, 120); });
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', skala, { passive: true });
    }
  }

  function skala() {
    var lw = wrap.clientWidth, lh = wrap.clientHeight;
    var s  = Math.min(lw / LEBAR, lh / TINGGI);

    // Pada layar sangat kecil & tegak, minta pengguna memutar perangkat.
    var tegakSempit = lh > lw && lw < 640;
    document.body.classList.toggle('perlu-putar', tegakSempit);

    el.style.transform = 'translate(-50%, -50%) scale(' + s + ')';
    RPN.skalaPanggung = s;
    RPN.bus.pancar('panggung:skala', s);
  }

  /* Ubah koordinat penunjuk layar menjadi koordinat di dalam kanvas,
     sudah memperhitungkan penskalaan panggung. */
  function titikKanvas(kanvas, ev) {
    var r = kanvas.getBoundingClientRect();
    var cx = ev.touches ? ev.touches[0].clientX : ev.clientX;
    var cy = ev.touches ? ev.touches[0].clientY : ev.clientY;
    return {
      x: (cx - r.left) / r.width  * kanvas.clientWidth,
      y: (cy - r.top)  / r.height * kanvas.clientHeight
    };
  }

  /* Siapkan kanvas agar tajam di layar ber-DPI tinggi.
     Penting: reset transform dulu supaya skala tidak menumpuk
     setiap kali ukuran berubah. */
  function siapkanKanvas(kanvas) {
    var ctx = kanvas.getContext('2d');
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = kanvas.clientWidth, h = kanvas.clientHeight;
    if (!w || !h) return ctx;
    var wantW = Math.round(w * dpr), wantH = Math.round(h * dpr);
    if (kanvas.width !== wantW || kanvas.height !== wantH) {
      kanvas.width = wantW; kanvas.height = wantH;
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);   // reset, bukan menumpuk
    return ctx;
  }

  RPN.panggung = {
    pasang: pasang,
    skala: skala,
    titikKanvas: titikKanvas,
    siapkanKanvas: siapkanKanvas,
    LEBAR: LEBAR,
    TINGGI: TINGGI
  };
})(window.RPN = window.RPN || {});

</script>
<script>
/* ===== scripts/core/audio.js ===== */
/* ============================================================
   audio.js — seluruh bunyi dibangkitkan Web Audio API.
   Tidak ada berkas suara eksternal sama sekali.
   ============================================================ */
(function (RPN) {
  'use strict';

  var ctx = null, nyala = true, master = null;
  var nadaBerjalan = {};   // bunyi menerus (putaran gasing, desir angin)

  function hidupkan() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return ctx; }
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = 0.9;
    master.connect(ctx.destination);
    return ctx;
  }

  function bolehBunyi() {
    if (!nyala) return false;
    return !!hidupkan();
  }

  /* --- Nada pendek (klik, benar, salah) --- */
  function nada(opsi) {
    if (!bolehBunyi()) return;
    var t = ctx.currentTime + (opsi.tunda || 0);
    var osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = opsi.bentuk || 'sine';
    osc.frequency.setValueAtTime(opsi.dari, t);
    if (opsi.ke) osc.frequency.exponentialRampToValueAtTime(Math.max(1, opsi.ke), t + (opsi.lama || .15));
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(opsi.keras || .16, t + .012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + (opsi.lama || .15));
    osc.connect(g); g.connect(master);
    osc.start(t); osc.stop(t + (opsi.lama || .15) + .02);
  }

  /* --- Derau tersaring (benturan, gesekan, angin) --- */
  function derau(opsi) {
    if (!bolehBunyi()) return;
    var lama = opsi.lama || .18;
    var n = Math.floor(ctx.sampleRate * lama);
    var buf = ctx.createBuffer(1, n, ctx.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    var src = ctx.createBufferSource(); src.buffer = buf;
    var f = ctx.createBiquadFilter();
    f.type = opsi.saring || 'lowpass';
    f.frequency.value = opsi.cutoff || 900;
    var g = ctx.createGain();
    g.gain.setValueAtTime(opsi.keras || .2, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + lama);
    src.connect(f); f.connect(g); g.connect(master);
    src.start();
  }

  /* --- Bunyi menerus yang bisa diatur nada & kerasnya --- */
  function mulaiMenerus(kunci, opsi) {
    if (!bolehBunyi()) return null;
    if (nadaBerjalan[kunci]) return nadaBerjalan[kunci];
    var osc = ctx.createOscillator(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    osc.type = (opsi && opsi.bentuk) || 'sawtooth';
    osc.frequency.value = (opsi && opsi.dari) || 120;
    f.type = 'lowpass'; f.frequency.value = 700;
    g.gain.value = 0.0001;
    osc.connect(f); f.connect(g); g.connect(master);
    osc.start();
    return (nadaBerjalan[kunci] = { osc: osc, f: f, g: g });
  }

  function aturMenerus(kunci, freq, keras, cutoff) {
    var n = nadaBerjalan[kunci];
    if (!n || !ctx) return;
    var t = ctx.currentTime;
    n.osc.frequency.setTargetAtTime(Math.max(20, freq), t, .05);
    n.g.gain.setTargetAtTime(nyala ? Math.max(0.0001, keras) : 0.0001, t, .06);
    if (cutoff) n.f.frequency.setTargetAtTime(cutoff, t, .06);
  }

  function hentikanMenerus(kunci) {
    var n = nadaBerjalan[kunci];
    if (!n || !ctx) return;
    n.g.gain.setTargetAtTime(0.0001, ctx.currentTime, .05);
  }

  function bersihkanSemua() {
    for (var k in nadaBerjalan) hentikanMenerus(k);
  }

  /* --- Bunyi siap pakai --- */
  var efek = {
    klik:    function () { nada({ dari: 620, ke: 880, lama: .07, keras: .09, bentuk: 'triangle' }); },
    pindah:  function () { nada({ dari: 430, ke: 660, lama: .12, keras: .10, bentuk: 'sine' }); },
    benar:   function () {
      [523.25, 659.25, 783.99].forEach(function (f, i) {
        nada({ dari: f, lama: .22, keras: .13, tunda: i * .075, bentuk: 'sine' });
      });
    },
    salah:   function () { nada({ dari: 300, ke: 150, lama: .28, keras: .13, bentuk: 'triangle' }); },
    hebat:   function () {
      [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach(function (f, i) {
        nada({ dari: f, lama: .3, keras: .12, tunda: i * .085, bentuk: 'sine' });
      });
    },
    tumbuk:  function (kuat) { derau({ lama: .2, cutoff: 380 + (kuat || .5) * 900, keras: Math.min(.32, .1 + (kuat || .5) * .25) }); },
    kayu:    function () { nada({ dari: 420 + Math.random() * 170, ke: 120, lama: .06, keras: .14, bentuk: 'triangle' }); },
    lonceng: function () { nada({ dari: 880, lama: .3, keras: .12 }); nada({ dari: 1320, lama: .3, keras: .07 }); },
    lenting: function () { nada({ dari: 180, ke: 620, lama: .11, keras: .13, bentuk: 'triangle' }); }
  };

  RPN.audio = {
    efek: efek,
    nada: nada,
    derau: derau,
    mulaiMenerus: mulaiMenerus,
    aturMenerus: aturMenerus,
    hentikanMenerus: hentikanMenerus,
    bersihkanSemua: bersihkanSemua,
    hidupkan: hidupkan,
    get nyala() { return nyala; },
    set nyala(v) {
      nyala = !!v;
      if (!nyala) bersihkanSemua();
      RPN.bus.pancar('audio:ubah', nyala);
    }
  };
})(window.RPN = window.RPN || {});

</script>
<script>
/* ===== scripts/core/store.js ===== */
/* ============================================================
   store.js — menyimpan kemajuan belajar murid.
   Memakai localStorage bila tersedia; bila diblokir (mode privat,
   berkas dibuka langsung dari disk), otomatis jatuh ke memori
   sehingga aplikasi tetap berjalan normal.
   ============================================================ */
(function (RPN) {
  'use strict';

  var KUNCI = 'rpn.kemajuan.v1';
  var cadangan = {};                 // penyimpanan memori
  var adaLocal = (function () {
    try {
      var t = '__uji__';
      window.localStorage.setItem(t, '1');
      window.localStorage.removeItem(t);
      return true;
    } catch (e) { return false; }
  })();

  function bacaMentah() {
    if (!adaLocal) return cadangan;
    try { return JSON.parse(window.localStorage.getItem(KUNCI) || '{}'); }
    catch (e) { return {}; }
  }

  function tulisMentah(obj) {
    if (!adaLocal) { cadangan = obj; return; }
    try { window.localStorage.setItem(KUNCI, JSON.stringify(obj)); }
    catch (e) { cadangan = obj; }
  }

  var awal = {
    dikunjungi: {},     // idModul -> true
    kuis: {},           // idModul -> { benar, total }
    percobaan: {},      // idModul -> jumlah percobaan simulasi
    evaluasi: null      // { benar, total, waktu }
  };

  function muat() {
    var d = bacaMentah();
    return {
      dikunjungi: d.dikunjungi || {},
      kuis: d.kuis || {},
      percobaan: d.percobaan || {},
      evaluasi: d.evaluasi || null
    };
  }

  var data = muat();

  var api = {
    get data() { return data; },
    tersimpanPermanen: adaLocal,

    kunjungi: function (id) {
      if (data.dikunjungi[id]) return;
      data.dikunjungi[id] = true;
      tulisMentah(data);
      RPN.bus.pancar('kemajuan:ubah', data);
    },

    catatKuis: function (id, benar, total) {
      var lama = data.kuis[id];
      // simpan hasil terbaik agar murid terdorong mencoba lagi
      if (!lama || benar > lama.benar) {
        data.kuis[id] = { benar: benar, total: total };
        tulisMentah(data);
        RPN.bus.pancar('kemajuan:ubah', data);
      }
    },

    catatPercobaan: function (id) {
      data.percobaan[id] = (data.percobaan[id] || 0) + 1;
      tulisMentah(data);
    },

    catatEvaluasi: function (benar, total) {
      data.evaluasi = { benar: benar, total: total, waktu: Date.now() };
      tulisMentah(data);
      RPN.bus.pancar('kemajuan:ubah', data);
    },

    /* Berapa modul yang sudah dituntaskan (dikunjungi + kuis lulus) */
    ringkas: function (daftarModul) {
      var tuntas = 0, dibuka = 0;
      daftarModul.forEach(function (m) {
        if (data.dikunjungi[m.id]) dibuka++;
        var k = data.kuis[m.id];
        if (k && k.total > 0 && k.benar / k.total >= 0.6) tuntas++;
      });
      return { dibuka: dibuka, tuntas: tuntas, total: daftarModul.length };
    },

    hapus: function () {
      data = { dikunjungi: {}, kuis: {}, percobaan: {}, evaluasi: null };
      tulisMentah(data);
      RPN.bus.pancar('kemajuan:ubah', data);
    }
  };

  RPN.simpanan = api;
})(window.RPN = window.RPN || {});

</script>
<script>
/* ===== scripts/core/ui.js ===== */
/* ============================================================
   ui.js — potongan antarmuka yang dipakai berulang oleh modul:
   penggeser, panel ukur, pilihan preset, kotak catatan.
   ============================================================ */
(function (RPN) {
  'use strict';

  function el(tag, kelas, isi) {
    var n = document.createElement(tag);
    if (kelas) n.className = kelas;
    if (isi != null) n.innerHTML = isi;
    return n;
  }

  /**
   * Penggeser bernilai.
   * o = { nama, min, max, step, nilai, format(v), skala:[kiri,tengah,kanan], saatUbah(v) }
   */
  function penggeser(o) {
    var w = el('div', 'penggeser');
    var kepala = el('div', 'kepala');
    kepala.appendChild(el('span', 'nama', o.nama));
    var nilai = el('span', 'nilai', o.format ? o.format(o.nilai) : o.nilai);
    kepala.appendChild(nilai);
    w.appendChild(kepala);

    var inp = document.createElement('input');
    inp.type = 'range';
    inp.min = o.min; inp.max = o.max; inp.step = o.step; inp.value = o.nilai;
    inp.setAttribute('aria-label', o.nama);
    w.appendChild(inp);

    if (o.skala) {
      var sk = el('div', 'skala');
      o.skala.forEach(function (t) { sk.appendChild(el('span', '', t)); });
      w.appendChild(sk);
    }

    inp.addEventListener('input', function () {
      var v = parseFloat(inp.value);
      nilai.innerHTML = o.format ? o.format(v) : v;
      if (o.saatUbah) o.saatUbah(v);
    });

    w.setNilai = function (v) {
      inp.value = v;
      nilai.innerHTML = o.format ? o.format(v) : v;
    };
    return w;
  }

  /**
   * Panel ukur (HUD).
   * o = { nama, satuan, warna:'kuning|hijau|ungu|merah', maks }
   * Mengembalikan elemen dengan method .set(nilai, teksOpsional)
   */
  function ukur(o) {
    var w = el('div', 'ukur' + (o.warna ? ' ukur-' + o.warna : ''));
    w.appendChild(el('div', 'nama', o.nama));
    var baris = el('div', 'baris g1');
    baris.style.alignItems = 'baseline';
    var n = el('span', 'nilai', '0');
    baris.appendChild(n);
    if (o.satuan) baris.appendChild(el('span', 'satuan', o.satuan));
    w.appendChild(baris);
    var bar = el('div', 'bar', '<i></i>');
    w.appendChild(bar);
    var isiBar = bar.firstChild;

    w.set = function (v, teks) {
      n.textContent = teks != null ? teks : v;
      if (o.maks) isiBar.style.width = Math.max(0, Math.min(100, v / o.maks * 100)) + '%';
    };
    return w;
  }

  /**
   * Kelompok pilihan berbentuk kartu (preset).
   * o = { kolom, daftar:[{id, ikon, tajuk, ket}], terpilih, saatPilih(id) }
   */
  function pilihan(o) {
    var w = el('div', 'pilihan-grid');
    w.style.gridTemplateColumns = 'repeat(' + (o.kolom || o.daftar.length) + ', 1fr)';
    var tombol = {};
    o.daftar.forEach(function (d) {
      var b = el('button', 'pilihan');
      b.type = 'button';
      b.setAttribute('aria-pressed', d.id === o.terpilih ? 'true' : 'false');
      if (d.ikon) b.appendChild(el('span', 'ikon', d.ikon));
      b.appendChild(el('span', 'tajuk', d.tajuk));
      if (d.ket) b.appendChild(el('span', 'ket', d.ket));
      b.addEventListener('click', function () {
        for (var k in tombol) tombol[k].setAttribute('aria-pressed', 'false');
        b.setAttribute('aria-pressed', 'true');
        RPN.audio.efek.klik();
        if (o.saatPilih) o.saatPilih(d.id);
      });
      tombol[d.id] = b;
      w.appendChild(b);
    });
    w.pilih = function (id) {
      for (var k in tombol) tombol[k].setAttribute('aria-pressed', k === id ? 'true' : 'false');
    };
    return w;
  }

  /* Kotak catatan berwarna */
  function catatan(warna, tajuk, isi) {
    return el('div', 'catatan' + (warna ? ' catatan-' + warna : '') + ' teks-s',
      (tajuk ? '<span class="tajuk">' + tajuk + '</span>' : '') + isi);
  }

  /* Judul kecil untuk bagian panel */
  function tajukPanel(teks, lencana, warnaLencana) {
    var w = el('div', 'baris antara g2');
    w.appendChild(el('div', 'judul-s', teks));
    if (lencana) w.appendChild(el('span', 'lencana lencana-' + (warnaLencana || 'biru'), lencana));
    return w;
  }

  /* Baris tombol aksi */
  function aksi(daftar) {
    var w = el('div', 'baris g2 bungkus');
    daftar.forEach(function (d) {
      var b = el('button', 'tbl tbl-kecil ' + (d.kelas || 'tbl-garis'),
        (d.ikon ? d.ikon + ' ' : '') + '<span>' + d.teks + '</span>');
      b.type = 'button';
      b.addEventListener('click', d.aksi);
      if (d.simpan) d.simpan(b);
      w.appendChild(b);
    });
    return w;
  }

  /* Tabel kecil untuk mencatat hasil percobaan (Langkah "Bandingkan") */
  function tabelCatat(kolom) {
    var w = el('div', '');
    w.style.border = '1px solid var(--c-line)';
    w.style.borderRadius = 'var(--r-md)';
    w.style.overflow = 'hidden';
    var t = document.createElement('table');
    t.style.width = '100%';
    t.style.borderCollapse = 'collapse';
    t.style.fontSize = '12.5px';
    var thead = document.createElement('thead');
    var tr = document.createElement('tr');
    kolom.forEach(function (k) {
      var th = document.createElement('th');
      th.textContent = k;
      th.style.cssText = 'text-align:left;padding:7px 9px;background:var(--c-surface-2);' +
                         'font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--c-ink-faint)';
      tr.appendChild(th);
    });
    thead.appendChild(tr); t.appendChild(thead);
    var tbody = document.createElement('tbody');
    t.appendChild(tbody); w.appendChild(t);

    w.tambah = function (sel) {
      var r = document.createElement('tr');
      sel.forEach(function (s, i) {
        var td = document.createElement('td');
        td.innerHTML = s;
        td.style.cssText = 'padding:7px 9px;border-top:1px solid var(--c-line-soft);' +
                           (i === 0 ? 'font-weight:700;' : 'font-family:var(--f-num);');
        r.appendChild(td);
      });
      tbody.insertBefore(r, tbody.firstChild);
      while (tbody.children.length > 6) tbody.removeChild(tbody.lastChild);
    };
    w.kosong = function () { tbody.innerHTML = ''; };
    w.jumlahBaris = function () { return tbody.children.length; };
    return w;
  }

  RPN.ui = {
    el: el, penggeser: penggeser, ukur: ukur, pilihan: pilihan,
    catatan: catatan, tajukPanel: tajukPanel, aksi: aksi, tabelCatat: tabelCatat
  };
})(window.RPN = window.RPN || {});

</script>
<script>
/* ===== scripts/core/quiz.js ===== */
/* ============================================================
   quiz.js — mesin asesmen formatif.
   Setiap pilihan punya penjelasan sendiri, sehingga umpan balik
   tidak berhenti di "benar/salah" tetapi meluruskan miskonsepsi.
   ============================================================ */
(function (RPN) {
  'use strict';

  var HURUF = ['A', 'B', 'C', 'D', 'E'];

  function el(tag, kelas, isi) {
    var n = document.createElement(tag);
    if (kelas) n.className = kelas;
    if (isi != null) n.innerHTML = isi;
    return n;
  }

  /**
   * Membuat sesi kuis.
   * @param {HTMLElement} wadah  tempat kuis digambar
   * @param {Array} soal        daftar soal
   * @param {Object} opsi       { judul, saatSelesai(benar, total) }
   */
  function buat(wadah, soal, opsi) {
    opsi = opsi || {};
    var ke = 0, benar = 0, terjawab = false;

    function gambar() {
      wadah.innerHTML = '';
      if (ke >= soal.length) return selesai();

      var s = soal[ke];
      var kotak = el('div', 'kolom g4 muncul');

      /* Kepala: nomor soal + indikator progres */
      var kepala = el('div', 'baris antara g3');
      kepala.appendChild(el('span', 'lencana', 'Soal ' + (ke + 1) + ' dari ' + soal.length));
      var skor = el('span', 'teks-s lembut angka', 'Benar: ' + benar);
      kepala.appendChild(skor);
      kotak.appendChild(kepala);

      /* Pertanyaan */
      kotak.appendChild(el('p', 'kuis-soal', s.tanya));

      if (s.petunjuk) {
        kotak.appendChild(el('div', 'catatan catatan-kuning teks-s',
          '<span class="tajuk">Petunjuk</span>' + s.petunjuk));
      }

      /* Pilihan jawaban */
      var daftar = el('div', 'kuis-opsi');
      s.opsi.forEach(function (o, i) {
        var b = el('button', 'opsi');
        b.type = 'button';
        b.appendChild(el('span', 'huruf', HURUF[i]));
        b.appendChild(el('span', '', o.teks));
        b.addEventListener('click', function () { jawab(i, daftar, kotak, s); });
        daftar.appendChild(b);
      });
      kotak.appendChild(daftar);

      wadah.appendChild(kotak);
      terjawab = false;
    }

    function jawab(pilih, daftar, kotak, s) {
      if (terjawab) return;
      terjawab = true;

      var tombol = daftar.querySelectorAll('.opsi');
      var betul = s.opsi[pilih].benar === true;
      if (betul) benar++;

      for (var i = 0; i < tombol.length; i++) {
        tombol[i].disabled = true;
        if (s.opsi[i].benar) tombol[i].classList.add('benar');
        else if (i === pilih) tombol[i].classList.add('salah');
      }

      RPN.audio.efek[betul ? 'benar' : 'salah']();

      /* Umpan balik konstruktif: alasan pilihan yang dipilih,
         lalu penguatan konsep yang benar. */
      var umpan = el('div', 'catatan ' + (betul ? 'catatan-hijau' : 'catatan-merah') + ' muncul');
      var judul = betul ? 'Tepat sekali!' : 'Belum tepat — ini sebabnya';
      var isi = '<span class="tajuk">' + judul + '</span>' + (s.opsi[pilih].alasan || '');
      if (!betul) {
        var kunci = s.opsi.filter(function (o) { return o.benar; })[0];
        if (kunci) isi += '<br><br><b>Jawaban yang tepat:</b> ' + kunci.teks +
                          (kunci.alasan ? ' — ' + kunci.alasan : '');
      }
      if (s.penguatan) isi += '<br><br><b>Ingat:</b> ' + s.penguatan;
      umpan.innerHTML = isi;
      kotak.appendChild(umpan);

      var kaki = el('div', 'baris tengah g3');
      var lanjut = el('button', 'tbl tbl-utama',
        (ke + 1 < soal.length ? 'Soal berikutnya' : 'Lihat hasil') +
        ' <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>');
      lanjut.type = 'button';
      lanjut.addEventListener('click', function () { ke++; RPN.audio.efek.klik(); gambar(); });
      kaki.appendChild(lanjut);
      kotak.appendChild(kaki);
      /* Fokus tanpa menggulung paksa, lalu geser seperlunya saja
         supaya pertanyaan di atas tidak ikut terpotong. */
      lanjut.focus({ preventScroll: true });
      if (umpan.scrollIntoView) umpan.scrollIntoView({ block: 'nearest' });
    }

    function selesai() {
      var persen = Math.round(benar / soal.length * 100);
      var lulus = persen >= 60;
      var kotak = el('div', 'kolom g4 muncul');
      kotak.style.textAlign = 'center';
      kotak.style.alignItems = 'center';

      kotak.appendChild(el('div', '', '<div style="font-size:56px;line-height:1">' +
        (persen === 100 ? '🏆' : lulus ? '🎉' : '💪') + '</div>'));
      kotak.appendChild(el('h3', 'judul-l', lulus ? 'Kerja bagus!' : 'Ayo coba sekali lagi'));
      kotak.appendChild(el('p', 'teks lembut',
        'Kamu menjawab benar <b>' + benar + ' dari ' + soal.length + '</b> soal (' + persen + '%).'));

      if (!lulus) {
        kotak.appendChild(el('div', 'catatan catatan-kuning teks-s',
          '<span class="tajuk">Saran</span>Buka kembali simulasinya, ubah satu pengaturan saja, ' +
          'lalu amati apa yang berubah. Setelah itu kerjakan kuis ini lagi.'));
      }

      var kaki = el('div', 'baris tengah g3 bungkus');
      var ulang = el('button', 'tbl tbl-garis', 'Ulangi kuis');
      ulang.type = 'button';
      ulang.addEventListener('click', function () {
        ke = 0; benar = 0; RPN.audio.efek.klik(); gambar();
      });
      kaki.appendChild(ulang);
      kotak.appendChild(kaki);

      wadah.innerHTML = '';
      wadah.appendChild(kotak);

      if (persen === 100) RPN.audio.efek.hebat();
      if (opsi.saatSelesai) opsi.saatSelesai(benar, soal.length);
    }

    gambar();
    return { ulangi: function () { ke = 0; benar = 0; gambar(); } };
  }

  RPN.kuis = { buat: buat };

    kep.appendChild(cip);

    /* Badan: kiri simulasi, kanan panel */
    var badan = el('div', 'isi-penuh');

    badan.style.gridTemplateColumns = '1fr 372px';

    var kolKiri = el('div', 'kolom g3');
    kolKiri.style.minHeight = '0';
    var simWadah = el('div', 'panggung-sim isi-penuh');

    var panelWadah = el('div', 'kartu kartu-pad kolom g4');

    badan.appendChild(kolKiri);
    badan.appendChild(panelWadah);
    isi.appendChild(badan);
    s.appendChild(isi);

    /* ---- Kaki: navigasi langkah ---- */
    var bSebelum = el('button', 'tbl tbl-sunyi', IKON.kiri + '<span>Sebelumnya</span>');
    bSebelum.type = 'button';
    var infoLangkah = el('span', 'teks-s lembut');
    var bBerikut = el('button', 'tbl tbl-utama', '<span>Berikutnya</span>' + IKON.kanan);
    bBerikut.type = 'button';

    bSebelum.addEventListener('click', function () {
      RPN.audio.efek.pindah();
      if (modulAktif.langkah === 0) buka('menu');
      else keLangkah(modulAktif.langkah - 1);
    });
    bBerikut.addEventListener('click', function () {
      RPN.audio.efek.pindah();
      if (modulAktif.langkah === namaLangkah.length - 1) {
        var i = modul.indexOf(def);
        if (i < modul.length - 1) buka('modul', modul[i + 1].id);
        else buka('evaluasi');
      } else {
        keLangkah(modulAktif.langkah + 1);
      }
    });

    var kiriKaki = el('div', 'baris g3'); kiriKaki.appendChild(bSebelum);
    var kananKaki = el('div', 'baris g3');
    kananKaki.appendChild(infoLangkah);
    kananKaki.appendChild(bBerikut);
    s.appendChild(kaki(kiriKaki, kananKaki));
    dom.isi.appendChild(s);

    /* ---- Jalankan simulasi ---- */
    if (!modulAktif.mesin) {
      modulAktif.mesin = def.buat({ sim: simWadah, ukur: ukurWadah });
      if (modulAktif.mesin._mulai) modulAktif.mesin._mulai();
    } else {
      modulAktif.mesin.pindahWadah({ sim: simWadah, ukur: ukurWadah });
    }

    function keLangkah(i) {
      i = Math.max(0, Math.min(namaLangkah.length - 1, i));
      modulAktif.langkah = i;

      var anak = cip.children;
      for (var j = 0; j < anak.length; j++) {
        anak[j].className = 'tbl tbl-kecil ' + (j === i ? 'tbl-utama' : 'tbl-sunyi');

      infoLangkah.textContent = 'Langkah ' + (i + 1) + ' dari ' + namaLangkah.length;
      bSebelum.querySelector('span').textContent = i === 0 ? 'Kembali ke Menu' : 'Sebelumnya';

      panelWadah.innerHTML = '';
      panelWadah.scrollTop = 0;

      if (i === namaLangkah.length - 1) {
        /* Langkah terakhir: kuis memakai seluruh lebar */
        badan.style.gridTemplateColumns = '1fr';
        kolKiri.style.display = 'none';
        panelWadah.style.maxWidth = '760px';
        panelWadah.style.margin = '0 auto';
        panelWadah.style.width = '100%';
        RPN.kuis.buat(panelWadah, def.kuis, {
          saatSelesai: function (b, t) {
            RPN.simpanan.catatKuis(def.id, b, t);
            segarkanProgres();

        });
        bBerikut.querySelector('span').textContent = 'Modul berikutnya';
      } else {
        badan.style.gridTemplateColumns = '1fr 372px';
        kolKiri.style.display = 'flex';
        panelWadah.style.maxWidth = '';
        panelWadah.style.margin = '';
        modulAktif.mesin.gambarPanel(i, panelWadah);
        bBerikut.querySelector('span').textContent = 'Berikutnya';
      }
      modulAktif.mesin.keLangkah(i);
      requestAnimationFrame(function () { modulAktif.mesin.ukurUlang(); });
    }

    keLangkah(modulAktif.langkah);
  }

  function mulai() {

<script>
/* ===== scripts/modules/gasing.js ===== */
/* ============================================================
   MODUL 1 — GASING
   Fokus SMP (Fase D): gerak berputar, gaya gesek, perubahan
   bentuk energi, dan rancangan percobaan uji adil.
   Materi SMA (momentum sudut vektor, torsi silang, rumus
   presesi, momen inersia I = k m r^2) sengaja tidak ditampilkan.
   Model fisikanya tetap dipakai di balik layar agar perilaku
   simulasi benar secara keilmuan.
   ============================================================ */
(function (RPN) {
  'use strict';
  var U = RPN.ui, el = U.el;

  var BENTUK = {
    kerucut: { k: 0.30, nama: 'Kerucut', ket: 'Gasing kayu Melayu', warna: ['#c98a3c', '#f3c17a', '#8a5a2b'] },
    cakram:  { k: 0.50, nama: 'Cakram',  ket: 'Pipih dan rata',      warna: ['#3f7fc4', '#8fc2ef', '#245a94'] },
    tepi:    { k: 0.80, nama: 'Berat di tepi', ket: 'Bandul di pinggir', warna: ['#7b4fa8', '#c3a2e4', '#55307a'] }
  };

  RPN.app.daftarkan({
    id: 'gasing',
    judul: 'Gasing',
    ikon: '🌀',
    warna: 'ungu',
    latar: 'linear-gradient(140deg,#f0e9f8,#e6eff9)',
    mapel: 'IPA · Gerak & Energi',
    fase: 'Fase D · Kelas VII–VIII',
    ringkas: 'Kenapa gasing tidak roboh saat berputar kencang, lalu tumbang ketika melambat?',
    langkah: ['Amati', 'Ubah', 'Bandingkan'],

    buat: function (dom) {
      /* ---------------- keadaan ---------------- */
      var bentuk = 'kerucut', massa = 0.25, jari = 0.08;
      var tarikan = 1800;            // putaran per menit saat diluncurkan
      var gesekan = 0.02;            // kekasaran lantai
      var berputar = false, jeda = false, lajuWaktu = 1;
      var omega = 0, miring = 0.12, sudutPresesi = 0, sudutPutar = 0;
      var waktuPutar = 0, omegaAwal = 1, goyangWaktu = 0;
      var jejak = [];
      var rafId = null, waktuLalu = 0;
      var kanvas, ctx, ukurRpm, ukurWaktu, ukurTenaga, ukurMiring;
      var tabel = null, langkahKini = 0;
      var G = 9.81;

      /* ---------------- susun DOM ---------------- */
      function pasangDom(d) {
        d.sim.innerHTML = '';
        kanvas = document.createElement('canvas');
        kanvas.setAttribute('aria-label', 'Simulasi gasing berputar');
        d.sim.appendChild(kanvas);

        d.ukur.innerHTML = '';
        ukurRpm    = U.ukur({ nama: 'Kecepatan Putar', satuan: 'putaran/menit', maks: 3000 });
        ukurWaktu  = U.ukur({ nama: 'Lama Berputar', satuan: 'detik', warna: 'hijau', maks: 60 });
        ukurTenaga = U.ukur({ nama: 'Sisa Tenaga Putar', satuan: '%', warna: 'kuning', maks: 100 });
        ukurMiring = U.ukur({ nama: 'Kemiringan', satuan: 'derajat', warna: 'merah', maks: 80 });
        [ukurRpm, ukurWaktu, ukurTenaga, ukurMiring].forEach(function (u) { d.ukur.appendChild(u); });
      }
      pasangDom(dom);

      /* ---------------- fisika ---------------- */
      function inersia() { return BENTUK[bentuk].k * massa * jari * jari; }

      function luncurkan() {
        omega = tarikan * 2 * Math.PI / 60;
        omegaAwal = omega;
        miring = 0.10;
        sudutPresesi = 0; goyangWaktu = 0; waktuPutar = 0;
        jejak = [];
        berputar = true; jeda = false;
        RPN.audio.mulaiMenerus('gasing');
        RPN.simpanan.catatPercobaan('gasing');
      }

      function hentikan() {
        berputar = false; omega = 0;
        RPN.audio.hentikanMenerus('gasing');
      }

      function ulang() {
        hentikan();
        miring = 0.10; sudutPresesi = 0; waktuPutar = 0; jejak = [];
      }

      function majuFisika(dt) {
        if (!berputar || jeda) return;
        dt *= lajuWaktu;
        var I = inersia();

        /* Gesekan ujung gasing dengan lantai + hambatan udara
           menguras tenaga putar. Kedua tetapan di bawah ditera
           agar lama putar simulasi masuk akal (puluhan detik),
           sebagaimana gasing kayu sungguhan. */
        var torsiGesek = gesekan * massa * G * 0.040
                       + 2.8e-6 * Math.pow(omega, 1.5) * Math.pow(jari / 0.08, 2);
        omega = Math.max(0, omega - (torsiGesek / I) * dt);
        sudutPutar += omega * dt;
        waktuPutar += dt;

        var rPusat = jari * 1.2;
        var lajuPresesi = omega > 0.5 ? (massa * G * rPusat) / (I * omega) : 14;
        sudutPresesi += lajuPresesi * dt;

        /* Makin lambat berputar, makin besar goyangannya. */
        var omegaKritis = Math.sqrt(4 * massa * G * rPusat / I) * 0.45;
        if (omega < omegaKritis) {
          goyangWaktu += dt;
          var kuat = Math.min(1, Math.pow((omegaKritis - omega) / omegaKritis, 2) + 0.05);
          miring += (0.55 * kuat) * dt;
        }

        if (miring >= Math.PI / 2.3 || omega <= 2) {
          berputar = false; omega = 0;
          RPN.audio.hentikanMenerus('gasing');
          RPN.audio.efek.tumbuk(0.5);
          catatHasil();
        }

        var rpm = omega * 60 / (2 * Math.PI);
        RPN.audio.aturMenerus('gasing', 55 + rpm / 3000 * 300,
          Math.min(0.05, rpm / 3000 * 0.05), 200 + rpm / 3000 * 1100);
      }

      function catatHasil() {
        if (!tabel || langkahKini !== 2) return;
        tabel.tambah([
          BENTUK[bentuk].nama,
          (massa * 1000).toFixed(0) + ' g',
          (jari * 100).toFixed(0) + ' cm',
          '<b>' + waktuPutar.toFixed(1) + ' s</b>'
        ]);
      }

      /* ---------------- gambar ---------------- */
      function gambar() {
        ctx = RPN.panggung.siapkanKanvas(kanvas);
        var w = kanvas.clientWidth, h = kanvas.clientHeight;
        if (!w || !h) return;
        ctx.clearRect(0, 0, w, h);

        /* Latar: ruangan terang dengan lantai kayu */
        var langit = ctx.createLinearGradient(0, 0, 0, h);
        langit.addColorStop(0, '#fdfaf4');
        langit.addColorStop(1, '#f0e6d6');
        ctx.fillStyle = langit;
        ctx.fillRect(0, 0, w, h);

        var cx = w * 0.5, cy = h * 0.70;

        /* Lantai */
        ctx.save();
        ctx.beginPath();
        ctx.ellipse(cx, cy, w * 0.44, w * 0.14, 0, 0, Math.PI * 2);
        var lantai = ctx.createRadialGradient(cx, cy, 10, cx, cy, w * 0.44);
        lantai.addColorStop(0, '#e8d6bb');
        lantai.addColorStop(1, '#d9c3a2');
        ctx.fillStyle = lantai;
        ctx.fill();
        ctx.strokeStyle = '#c3a97f';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        /* Lingkaran bantu jarak */
        ctx.strokeStyle = 'rgba(140,115,80,.22)';
        ctx.lineWidth = 1;
        for (var r = 38; r < w * 0.28; r += 38) {
          ctx.beginPath();
          ctx.ellipse(cx, cy, r, r * 0.30, 0, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.restore();

        /* Posisi ujung gasing (mengitari pusat = presesi) */
        var skala = 880;                       /* piksel per meter jari-jari */
        var panjangMiring = jari * skala * Math.sin(miring) * 1.5;
        var ux = cx + panjangMiring * Math.cos(sudutPresesi);
        var uy = cy + panjangMiring * Math.sin(sudutPresesi) * 0.30;

        if (berputar && !jeda) {
          jejak.push({ x: ux, y: uy });
          if (jejak.length > 90) jejak.shift();
        }

        /* Jejak orbit ujung gasing */
        if (jejak.length > 1) {
          ctx.beginPath();
          ctx.strokeStyle = 'rgba(107,63,150,.55)';
          ctx.lineWidth = 2.4;
          ctx.lineCap = 'round';
          for (var i = 0; i < jejak.length; i++) {
            ctx.globalAlpha = i / jejak.length;
            if (i === 0) ctx.moveTo(jejak[i].x, jejak[i].y);
            else ctx.lineTo(jejak[i].x, jejak[i].y);
          }
          ctx.stroke();
          ctx.globalAlpha = 1;
        }

        /* Bayangan */
        ctx.fillStyle = 'rgba(90,70,45,.22)';
        ctx.beginPath();
        ctx.ellipse(ux + 9, uy + 6, jari * skala * 0.9, jari * skala * 0.3, 0, 0, Math.PI * 2);
        ctx.fill();

        /* Sumbu gasing: dari ujung (ux,uy) menuju puncak */
        var tinggi = 175;
        var ax = ux + tinggi * Math.sin(miring) * Math.cos(sudutPresesi);
        var ay = uy - tinggi * Math.cos(miring) + tinggi * Math.sin(miring) * Math.sin(sudutPresesi) * 0.30;

        var B = BENTUK[bentuk];
        var R = Math.max(18, jari * skala);        /* jari-jari badan di layar */

        /* Semua bagian gasing digambar dalam satu sistem koordinat
           yang sudah dimiringkan, supaya paku, badan, dan pegangan
           menyatu sebagai satu benda. Sumbu lokal -y = ke arah puncak. */
        ctx.save();
        ctx.translate(ux, uy);
        ctx.rotate(Math.atan2(ay - uy, ax - ux) + Math.PI / 2);

        var yPangkal = -R * 0.42;                  /* tempat paku bertemu badan */
        var yPuncak  = yPangkal - R * 0.95;        /* sisi atas badan */

        /* 1. Paku besi di ujung bawah */
        var gPaku = ctx.createLinearGradient(-3, 0, 3, 0);
        gPaku.addColorStop(0, '#6b7382');
        gPaku.addColorStop(0.5, '#c8cfd9');
        gPaku.addColorStop(1, '#6b7382');
        ctx.fillStyle = gPaku;
        ctx.beginPath();
        ctx.moveTo(0, 2);
        ctx.lineTo(3.2, yPangkal);
        ctx.lineTo(-3.2, yPangkal);
        ctx.closePath();
        ctx.fill();

        /* 2. Badan gasing */
        var gBadan = ctx.createLinearGradient(-R, 0, R, 0);
        gBadan.addColorStop(0, B.warna[2]);
        gBadan.addColorStop(0.42, B.warna[1]);
        gBadan.addColorStop(1, B.warna[0]);
        ctx.fillStyle = gBadan;
        ctx.strokeStyle = 'rgba(60,35,10,.45)';
        ctx.lineWidth = 1.6;

        if (bentuk === 'kerucut') {
          /* Kerucut khas gasing kayu: meruncing ke bawah, melebar ke atas */
          ctx.beginPath();
          ctx.moveTo(0, yPangkal + R * 0.1);
          ctx.quadraticCurveTo(R * 0.62, yPangkal - R * 0.18, R, yPuncak);
          ctx.lineTo(-R, yPuncak);
          ctx.quadraticCurveTo(-R * 0.62, yPangkal - R * 0.18, 0, yPangkal + R * 0.1);
          ctx.closePath();
          ctx.fill(); ctx.stroke();
        } else if (bentuk === 'cakram') {
          /* Cakram pipih */
          var tebal = R * 0.34;
          ctx.beginPath();
          ctx.moveTo(-R * 1.12, yPuncak + tebal);
          ctx.lineTo(-R * 1.12, yPuncak);
          ctx.lineTo(R * 1.12, yPuncak);
          ctx.lineTo(R * 1.12, yPuncak + tebal);
          ctx.quadraticCurveTo(0, yPuncak + tebal * 2.1, -R * 1.12, yPuncak + tebal);
          ctx.closePath();
          ctx.fill(); ctx.stroke();
          R = R * 1.12;
        } else {
          /* Berat di tepi: cakram dengan bandul logam di pinggir */
          var tb = R * 0.3;
          ctx.beginPath();
          ctx.moveTo(-R * 1.25, yPuncak + tb);
          ctx.lineTo(-R * 1.25, yPuncak);
          ctx.lineTo(R * 1.25, yPuncak);
          ctx.lineTo(R * 1.25, yPuncak + tb);
          ctx.quadraticCurveTo(0, yPuncak + tb * 1.9, -R * 1.25, yPuncak + tb);
          ctx.closePath();
          ctx.fill(); ctx.stroke();
          R = R * 1.25;
        }

        /* 3. Tutup atas berbentuk elips + corak yang ikut berputar */
        var gTutup = ctx.createLinearGradient(-R, 0, R, 0);
        gTutup.addColorStop(0, B.warna[1]);
        gTutup.addColorStop(0.5, B.warna[0]);
        gTutup.addColorStop(1, B.warna[2]);
        ctx.fillStyle = gTutup;
        ctx.beginPath();
        ctx.ellipse(0, yPuncak, R, R * 0.3, 0, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();

        if (bentuk === 'tepi') {
          ctx.fillStyle = '#3d2359';
          for (var a = 0; a < Math.PI * 2; a += Math.PI / 4) {
            var pa = a + sudutPutar;
            ctx.beginPath();
            ctx.arc(Math.cos(pa) * R * 0.9, yPuncak + Math.sin(pa) * R * 0.27, 4.6, 0, Math.PI * 2);
            ctx.fill();
          }
        } else {
          ctx.fillStyle = 'rgba(255,255,255,.95)';
          for (var a2 = 0; a2 < Math.PI * 2; a2 += Math.PI / 3) {
            var pa2 = a2 + sudutPutar;
            ctx.beginPath();
            ctx.arc(Math.cos(pa2) * R * 0.62, yPuncak + Math.sin(pa2) * R * 0.19, 3.6, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        /* 4. Pegangan kayu di puncak */
        ctx.fillStyle = '#7a8494';
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(-4.5, yPuncak - 26, 9, 26, 4);
        else ctx.rect(-4.5, yPuncak - 26, 9, 26);
        ctx.fill();

        ctx.restore();

        /* Label keadaan */
        var pesan = !berputar && waktuPutar > 0 ? 'Gasing tumbang setelah ' + waktuPutar.toFixed(1) + ' detik'
                  : !berputar ? 'Tekan "Putar Gasing" untuk mulai'
                  : jeda ? 'Dijeda — amati posisinya' : '';
        if (pesan) {
          ctx.font = '700 15px ' + getComputedStyle(document.body).fontFamily;
          ctx.textAlign = 'center';
          var lebarTeks = ctx.measureText(pesan).width;
          ctx.fillStyle = 'rgba(255,255,255,.92)';
          if (ctx.roundRect) {
            ctx.beginPath(); ctx.roundRect(cx - lebarTeks / 2 - 14, 16, lebarTeks + 28, 32, 16); ctx.fill();
          }
          ctx.fillStyle = '#16233a';
          ctx.fillText(pesan, cx, 37);
          ctx.textAlign = 'left';
        }
      }

      /* ---------------- gelung animasi ---------------- */
      function gelung(t) {
        var dt = Math.min(0.033, (t - waktuLalu) / 1000) || 0;
        waktuLalu = t;
        majuFisika(dt);
        gambar();
        segarkanUkur();
        rafId = requestAnimationFrame(gelung);
      }

      function segarkanUkur() {
        var rpm = omega * 60 / (2 * Math.PI);
        ukurRpm.set(rpm, Math.round(rpm).toLocaleString('id-ID'));
        ukurWaktu.set(waktuPutar, waktuPutar.toFixed(1));
        var sisa = omegaAwal > 0 ? Math.pow(omega / omegaAwal, 2) * 100 : 0;
        ukurTenaga.set(sisa, Math.round(sisa));
        var drj = miring * 180 / Math.PI;
        ukurMiring.set(drj, Math.round(drj));

      function panelUbah(p) {

                     tajuk: BENTUK[k].nama, ket: BENTUK[k].ket };

        p.appendChild(U.penggeser({

        p.appendChild(U.penggeser({

          skala: ['Licin', 'Sedang', 'Kasar'],

          { teks: 'Putar Gasing', kelas: 'tbl-utama', ikon: RPN.app.IKON.main, aksi: function () { luncurkan(); } },
          { teks: 'Kosongkan tabel', aksi: function () { tabel.kosong(); RPN.audio.efek.klik(); } }
        ]));
        p.appendChild(tombolLajuWaktu());

        p.appendChild(U.catatan('hijau', '🎯 Misi',

        p.appendChild(U.catatan('', '🔍 Temuan yang diharapkan',

          'Itu sebabnya gasing aduan tradisional sering diberi cincin logam di tepinya.'));

        p.appendChild(U.catatan('ungu', '🏛️ Kaitan budaya',
          'Gasing dikenal di banyak daerah: <b>Gasing</b> di Melayu Riau, <b>Panggal</b> di Sunda, ' +
          '<b>Pathon</b> di Jawa, dan <b>Maggasing</b> di Bugis. Pembuatnya memilih kayu keras seperti asam ' +
          'atau jambu supaya berat dan tahan benturan — tanpa pernah membaca buku fisika.'));
      }

      /* ---------------- antarmuka modul ---------------- */
      return {
        gambarPanel: function (i, p) {
          langkahKini = i;
          if (i === 0) panelAmati(p);
          else if (i === 1) panelUbah(p);
          else panelBandingkan(p);
        },
        keLangkah: function (i) { langkahKini = i; if (i !== 2) tabel = null; },
        ukurUlang: function () { if (kanvas) RPN.panggung.siapkanKanvas(kanvas); },

        lepas: function () {

          rafId = null;
          RPN.audio.hentikanMenerus('gasing');
        },
        _mulai: function () { waktuLalu = performance.now(); rafId = requestAnimationFrame(gelung); }
      };
    },

          { teks: 'Gasing kecil dengan massa terkumpul di bagian tengah',
            alasan: 'Justru sebaliknya. Massa yang menumpuk di tengah membuat gasing mudah diperlambat, jadi lebih cepat tumbang.' },
          { teks: 'Ketiganya sama lama karena massanya sama',

        ],

      },
      {

        petunjuk: 'Dalam uji adil, hanya satu hal yang boleh berbeda.',
        opsi: [
          { teks: 'Dua gasing bentuk & ukuran sama, massa berbeda, ditarik sama kuat di lantai sama', benar: true,
            alasan: 'Hanya massa yang dibedakan. Jadi kalau hasilnya berbeda, penyebabnya pasti massa — inilah uji adil.' },
          { teks: 'Gasing berat di lantai licin dibandingkan gasing ringan di tanah',

        ],
