  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;0,600;1,400;1,500;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #1B5E8C; text-decoration: none; }
    a:hover { color: #123F60; }

    .rng { -webkit-appearance: none; appearance: none; height: 8px; border-radius: 999px; outline: none; cursor: pointer; border: none; }
    .rng::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 20px; height: 20px; border-radius: 50%; background: #FFFFFF; border: 3px solid currentColor; box-shadow: 0 1px 4px rgba(14,38,60,.30); cursor: pointer; }
    .rng::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: #FFFFFF; border: 3px solid currentColor; box-shadow: 0 1px 4px rgba(14,38,60,.30); cursor: pointer; }
    .rng:disabled { cursor: default; }
    .rng:disabled::-webkit-slider-thumb { cursor: default; }

    .xf { transition: opacity .18s ease; }
    .xf-on { opacity: 1; }
    .xf-off { opacity: 0; }

    @keyframes ktp-flyx { from { transform: translateX(0); } to { transform: translateX(var(--dx)); } }
    @keyframes ktp-flyy {
      0%   { transform: translateY(0); animation-timing-function: cubic-bezier(.18,.62,.42,1); }
      46%  { transform: translateY(calc(-1 * var(--peak))); animation-timing-function: cubic-bezier(.52,0,.74,.42); }
      100% { transform: translateY(var(--drop)); }
    }
    @keyframes ktp-spin { from { transform: rotate(0deg); } to { transform: rotate(var(--spin)); } }
    .flyx { animation: ktp-flyx var(--dur) linear forwards; }
    .flyy { animation: ktp-flyy var(--dur) linear forwards; }
    .flyr { animation: ktp-spin var(--dur) linear forwards; }

    @keyframes ktp-twang {
      0%   { transform: scaleY(1); }
      18%  { transform: scaleY(2.6); }
      38%  { transform: scaleY(.45); }
      58%  { transform: scaleY(1.5); }
      78%  { transform: scaleY(.82); }
      100% { transform: scaleY(1); }
    }
    .twang { transform-box: view-box; transform-origin: 455px 340px; animation: ktp-twang .38s ease-out both; }

    @keyframes ktp-pop { from { opacity: 0; transform: scale(.86); } to { opacity: 1; transform: scale(1); } }
    .pop { animation: ktp-pop .26s cubic-bezier(.2,.9,.3,1.2) both; }

    @keyframes ktp-dash { to { stroke-dashoffset: -28; } }
    .arcline { animation: ktp-dash 1.4s linear infinite; }

    .btn { border: none; cursor: pointer; font-family: inherit; }
    .btn:disabled { cursor: default; }
  </style>
</helmet>

<script data-dc-script data-props='{"jarakSasaran":{"editor":"int","default":12,"min":6,"max":18,"step":1,"unit":"m","section":"Skenario","tsType":"number"},"tampilLintasan":{"editor":"boolean","default":true,"section":"Tampilan","tsType":"boolean"},"tampilPanahGaya":{"editor":"boolean","default":true,"section":"Tampilan","tsType":"boolean"},"warnaAksen":{"editor":"color","default":"#1B3D5E","options":["#1B3D5E","#1E5A4E","#6B3F2A","#43356E"],"section":"Tampilan","tsType":"string"},"$preview":{"width":1440,"height":810}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { f: 60, m: 1, phase: 'idle' };
    this.onF = this.onF.bind(this);
    this.onM = this.onM.bind(this);
    this.onPrimary = this.onPrimary.bind(this);
  }

  componentWillUnmount() {
    if (this.timer) clearTimeout(this.timer);
  }

  fmt(v, d) {
    return v.toFixed(d).replace('.', ',');
  }

  // a = F/m ; v0 = akar(2*a*s) dengan s = 0,6 m panjang tarikan ;
  // jarak lempar sudut 45 derajat: R = v0^2 / g = 2*a*s/g dengan g = 10 m/s^2
  physics() {
    var T = this.props.jarakSasaran == null ? 12 : Number(this.props.jarakSasaran);
    var f = this.state.f;
    var m = this.state.m;
    var a = f / m;
    var s = 0.6;
    var g = 10;
    var R = 2 * a * s / g;
    var v0 = Math.sqrt(2 * a * s);
    var kind = 'short';
    if (R > 20.4) kind = 'out';
    else if (Math.abs(R - T) <= 0.6) kind = 'hit';
    else if (R > T) kind = 'long';
    return { T: T, f: f, m: m, a: a, R: R, v0: v0, kind: kind };
  }

  flight(c) {
    var PX = 47.5, X0 = 455, LX = 256, LY = 336, GY = 556, BY = 449;
    var dur = Math.min(2.2, Math.max(0.75, 0.1414 * c.v0));
    var landX, landY, peak;
    if (c.kind === 'out') {
      landX = 1462; landY = 296; peak = 148; dur = Math.min(dur, 1.6);
    } else {
      landX = X0 + c.R * PX;
      landY = c.kind === 'hit' ? BY : GY;
      peak = Math.min(148, Math.max(58, (c.R * PX) / 4));
    }
    return {
      dur: dur, durMs: dur * 1000, peak: peak, landX: landX, landY: landY,
      dx: landX - LX, drop: landY - LY
    };
  }

  onF(e) {
    if (this.state.phase !== 'idle') return;
    this.setState({ f: Number(e.target.value) });
  }

  onM(e) {
    if (this.state.phase !== 'idle') return;
    this.setState({ m: Math.round(Number(e.target.value) * 10) / 10 });
  }

  onPrimary() {
    var ph = this.state.phase;
    if (ph === 'flying') return;
    if (this.timer) clearTimeout(this.timer);
    if (ph === 'done') { this.setState({ phase: 'idle' }); return; }
    var fl = this.flight(this.physics());
    var self = this;
    this.setState({ phase: 'flying' });
    this.timer = setTimeout(function () { self.setState({ phase: 'done' }); }, fl.durMs + 60);
  }

  renderVals() {
    var c = this.physics();
    var fl = this.flight(c);
    var ph = this.state.phase;
    var idle = ph === 'idle', flying = ph === 'flying', done = ph === 'done';
    var accent = this.props.warnaAksen || '#1B3D5E';

    var label = '', bg = '', fg = '', dot = '', guide = '';
    if (idle) {
      guide = 'Atur gaya tarik dan massa batu, lalu tekan Lepaskan.';
    } else if (flying) {
      guide = 'Batu melesat dengan percepatan ' + this.fmt(c.a, 0) + ' m/s².';
    } else if (c.kind === 'hit') {
      label = 'Tepat Sasaran'; bg = '#E3F5EA'; fg = '#1F7A4C'; dot = '#2E9E63';
      guide = 'Percepatan ' + this.fmt(c.a, 0) + ' m/s² pas — batu mendarat tepat di papan sasaran.';
    } else if (c.kind === 'short') {
      label = 'Kurang Jauh'; bg = '#FDF2DE'; fg = '#A9670F'; dot = '#E0A030';
      guide = 'Kurang ' + this.fmt(c.T - c.R, 1) + ' m dari sasaran. Perbesar gaya tarik atau pakai batu yang lebih ringan.';
    } else if (c.kind === 'long') {
      label = 'Terlalu Jauh'; bg = '#FDF2DE'; fg = '#A9670F'; dot = '#E0A030';
      guide = 'Lewat ' + this.fmt(c.R - c.T, 1) + ' m dari sasaran. Kecilkan gaya tarik atau pakai batu yang lebih berat.';
    } else {
      label = 'Keluar Lapangan'; bg = '#FBEAE5'; fg = '#A93B27'; dot = '#D7452F';
      guide = 'Terlempar ' + this.fmt(c.R, 1) + ' m, jauh melewati batas lapangan 20 m.';
    }

    var aTxt = (Math.abs(c.a - Math.round(c.a)) < 0.05 ? this.fmt(c.a, 0) : this.fmt(c.a, 1)) + ' m/s²';
    var len = 34 + (c.f - 40) * 1.15;
    var tip = 500 + len;
    var x0 = 472, y0 = 362;

    return {
      accent: accent,
      f: c.f,
      m: c.m,
      fTxt: c.f + ' N',
      mTxt: this.fmt(c.m, 1) + ' kg',
      aTxt: aTxt,
      fPct: Math.round((c.f - 40) / 80 * 100) + '%',
      mPct: Math.round((c.m - 0.5) / 1 * 100) + '%',
      onF: this.onF,
      onM: this.onM,
      onPrimary: this.onPrimary,

      idle: idle,
      flying: flying,
      done: done,
      shot: !idle,
      locked: !idle,
      ctlOp: idle ? '1' : '0.55',
      btnOp: flying ? '0.66' : '1',
      btnLabel: idle ? 'Lepaskan' : (flying ? 'Melesat…' : 'Ulangi'),

      headLabel: idle ? 'Prakiraan Jarak' : (flying ? 'Batu Melesat' : 'Jarak Tembakan'),
      distTxt: flying ? '…' : this.fmt(c.R, 1),
      distColor: done ? '#17324F' : '#8398AC',
      showStatus: done,
      statusLabel: label,
      statusBg: bg,
      statusFg: fg,
      statusDot: dot,
      guidance: guide,

      tx: 455 + c.T * 47.5,
      sasaranTxt: 'Sasaran ' + this.fmt(c.T, 0) + ' m',

      showArc: this.props.tampilLintasan !== false,
      arcOp: idle ? 0.92 : 0.5,
      arcD: 'M ' + x0 + ' ' + y0 + ' Q ' + ((x0 + fl.landX) / 2).toFixed(1) + ' ' + (1.5 * y0 - 0.5 * fl.landY - 2 * fl.peak).toFixed(1) + ' ' + fl.landX.toFixed(1) + ' ' + fl.landY.toFixed(1),
      landX: Number(fl.landX.toFixed(1)),
      landY: Number(fl.landY.toFixed(1)),

      showGaya: this.props.tampilPanahGaya !== false && idle,
      faLineX: Number((tip - 14).toFixed(1)),
      faHead: (tip - 15).toFixed(1) + ',364 ' + tip.toFixed(1) + ',374 ' + (tip - 15).toFixed(1) + ',384',
      faLabel: 'F = ' + c.f + ' N',

      pullVis: idle ? 'xf-on' : 'xf-off',
      relVis: idle ? 'xf-off' : 'xf-on',
      dxPx: fl.dx.toFixed(1) + 'px',
      peakPx: fl.peak.toFixed(1) + 'px',
      dropPx: fl.drop.toFixed(1) + 'px',
      durS: fl.dur.toFixed(2) + 's',
      spinDeg: Math.round(200 + c.R * 40) + 'deg'
    };
  }
}
</script>
